<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ALINEMODASSS · Atacado plus size</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=VT323&display=swap"><style id="css">
/* Layout: vitrine estilo boutique argentina — faixa de aviso correndo, marca centrada espaçada, banner sangrado, blocos de categoria com legenda serifada minúscula, grade de fotos altas com etiqueta vermelha */
:root{
  --bg:#FFFFFF;--soft:#FBF5F0;--blush:#F7E6D9;--ink:#1F1A18;--ink-2:#6B605B;--line:#EBDFD6;
  --red:#B5442A;--red-ink:#FFFFFF;--pink:#B5442A;--pink-deep:#93341C;--on-photo:#FFFFFF;
  --wine:#3A1E14;--on-wine:#FFF4EC;--on-wine-2:#E9C2A8;--sun:#FFC83D;--on-sun:#3A1E14;--hero:#F4E5DE;--on-hero:#3A1E14;--hero-2:#7A5A4E;--hero-accent:#9A3E26;--hero-line:#D9BBAE;
  --wa:#11804A;--wa-ink:#FFFFFF;--danger:#B42318;--ok:#11804A;
  --shade:rgba(40,20,20,.18);--scrim:rgba(29,26,27,.45);--photo-scrim:rgba(20,10,12,.82);
  --ui:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shout:"Fraunces",Georgia,"Times New Roman",serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --pixel:"VT323",ui-monospace,"Courier New",monospace;
  --pill:#FFD3E1;--on-pill:#3A1E14;
  --r:4px;--r-sm:4px;--r-sheet:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141110;--soft:#1D1917;--blush:#2C201A;--ink:#F5EFEF;--ink-2:#BFB4B6;--line:#352E30;
  --red:#F0875F;--red-ink:#2A0D04;--pink:#F0875F;--pink-deep:#F5A886;--wine:#22120C;--on-wine:#FFF4EC;--on-wine-2:#E0B497;--hero:#221915;--on-hero:#F6E9E3;--hero-2:#C9AFA4;--hero-accent:#EDA88E;--hero-line:#4A3A33;--wa:#2BBE6E;--wa-ink:#03200F;--danger:#FF8A80;--ok:#2BBE6E;
  --shade:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141110;--soft:#1D1917;--blush:#2C201A;--ink:#F5EFEF;--ink-2:#BFB4B6;--line:#352E30;
  --red:#F0875F;--red-ink:#2A0D04;--pink:#F0875F;--pink-deep:#F5A886;--wine:#22120C;--on-wine:#FFF4EC;--on-wine-2:#E0B497;--hero:#221915;--on-hero:#F6E9E3;--hero-2:#C9AFA4;--hero-accent:#EDA88E;--hero-line:#4A3A33;--wa:#2BBE6E;--wa-ink:#03200F;--danger:#FF8A80;--ok:#2BBE6E;
  --shade:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.62);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
::selection{background:var(--pink);color:var(--on-photo)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
a{color:inherit;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html{scrollbar-color:var(--line) var(--bg)}
::-webkit-scrollbar{width:10px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--line)}
input,select,textarea{accent-color:var(--red)}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* aviso */
.ann{background:var(--bg);color:var(--red);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.ann-track{display:inline-flex;align-items:center;padding:5px 0;font:400 17px/1.1 var(--pixel);letter-spacing:.03em;text-transform:uppercase;animation:marq 42s linear infinite}
.ann:hover .ann-track,.ann:focus-within .ann-track{animation-play-state:paused}
.ann-track span{padding:0 18px;position:relative}
.ann-track span::after{content:"·";position:absolute;right:-3px}
@keyframes marq{to{transform:translateX(-50%)}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"seg brand bag" "nav nav nav";align-items:center;column-gap:10px;min-height:68px}
.topbar .seg{grid-area:seg}.topbar .brand{grid-area:brand}.topbar .bagbtn{grid-area:bag}.topbar .menu{grid-area:nav;min-width:0}
@media (min-width:1100px){
 .topbar{grid-template-columns:auto 1fr auto auto;grid-template-areas:"brand nav seg bag";column-gap:24px;min-height:84px}
 .topbar .brand{align-items:flex-start}
 .topbar .menu .menu-in{justify-content:center}
}
.seg{justify-self:start;display:inline-flex;gap:2px}
.seg button{border:0;background:none;padding:0 9px;min-height:40px;font:500 13px var(--ui);letter-spacing:.12em;color:var(--ink-2);border-bottom:1.5px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1}
.brand b{font:500 clamp(21px,2vw,27px)/.95 var(--shout);font-variation-settings:"opsz" 72;letter-spacing:.05em;white-space:nowrap;color:var(--ink)}
.brand small{font:600 10px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--pink);margin-top:6px;white-space:nowrap}
.bagbtn{justify-self:end;position:relative;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;width:46px;height:46px}
.bagbtn .ico{width:24px;height:24px}
.bagbtn .count{position:absolute;top:4px;right:2px;background:var(--ink);color:var(--bg);border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;font:600 11px var(--ui);padding:0 5px}
.menu .menu-in{display:flex;gap:0 26px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;padding-bottom:2px}
@media (max-width:899px){.menu .menu-in{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}}
@media (min-width:900px){.menu .menu-in{justify-content:center}}
.menu button{flex:none;border:0;background:none;min-height:44px;padding:0;font:600 14px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border-bottom:1.5px solid transparent}
.menu button:hover{color:var(--red)}
.menu button.hot{color:var(--red)}
.menu button[aria-current="true"]{border-bottom-color:var(--ink)}

/* banner */
.hero{background:var(--hero);color:var(--on-hero)}
.hero-in{display:grid}
@media (min-width:900px){.hero-in{grid-template-columns:1.15fr .85fr;min-height:min(640px,78vh)}}
.hero-copy{padding:clamp(34px,6vw,80px) max(16px,env(safe-area-inset-right,0px)) clamp(34px,5vw,64px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:center}
@media (min-width:900px){.hero-copy{padding-left:max(48px,env(safe-area-inset-left,0px))}}
.shout{font:300 italic clamp(76px,10.5vw,150px)/.9 var(--shout);font-variation-settings:"opsz" 144;color:var(--hero-accent);margin:0 0 0 -.04em;letter-spacing:-.035em;animation:shoutin 1.1s cubic-bezier(.16,1,.3,1) both}
.slogan{font:400 clamp(26px,3vw,40px)/1.12 var(--serif);font-variation-settings:"opsz" 48;margin:18px 0 10px;max-width:14em;text-wrap:balance;letter-spacing:-.01em}
.hsub{margin:0 0 34px;font:500 13px/1.4 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--hero-2)}
.big{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"num top" "num bot";align-items:center;column-gap:22px;row-gap:2px;margin:0 0 36px;padding-top:26px;border-top:1px solid var(--hero-line);max-width:26em}
.big span:first-child{grid-area:top;align-self:end}.big b{grid-area:num}.big span:last-child{grid-area:bot;align-self:start}
.big b{font:300 clamp(46px,5vw,64px)/1 var(--shout);font-variation-settings:"opsz" 144;color:var(--hero-accent);width:1.9em;height:1.9em;border:1px solid var(--hero-accent);border-radius:50%;display:grid;place-items:center;letter-spacing:-.02em;padding-bottom:.06em}
.big span{font:500 12.5px/1.35 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--hero-2);max-width:12em}
.hero-media{position:relative;display:block;border:0;padding:0;background:none;min-height:max(360px,62vw);cursor:pointer;overflow:hidden}
@media (min-width:900px){.hero-media{min-height:0}}
.hero-media .cover img{object-fit:contain;object-position:center}
.hero.has-cover .hero-media{aspect-ratio:var(--cover-ar,3/4);min-height:0;width:100%}
@media (min-width:900px){
 .hero.has-cover .hero-in{grid-template-columns:1fr auto;min-height:0}
 .hero.has-cover .hero-media{height:min(760px,calc(100vh - 120px));min-height:520px;width:auto}
}
.hero-media .niche{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.hero-media:hover .niche{transform:scale(1.03)}
.hero-media .lab{position:absolute;left:16px;bottom:16px;z-index:1;background:rgba(255,255,255,.92);color:#3A1E14;padding:10px 14px;text-align:left;font:500 12.5px/1.4 var(--ui);letter-spacing:.08em;text-transform:uppercase;max-width:calc(100% - 32px);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-media .lab b{display:block;font-weight:600}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:0;border:1px solid transparent;font:600 13.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background-color .2s,color .2s,border-color .2s,filter .2s}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{background:var(--red);color:var(--red-ink)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-wa:hover{filter:brightness(1.08)}
.btn-ghost{border-color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:var(--bg)}
.btn[aria-disabled="true"]{background:var(--line);border-color:var(--line);color:var(--ink-2);cursor:not-allowed;filter:none}
.btn-sm{min-height:42px;padding:0 16px;font-size:12.5px}
@keyframes shoutin{from{transform:translateY(24px)}}
.hero .btn-ink{background:var(--on-hero);color:var(--hero)}
.hero .btn-ink:hover{background:var(--hero-accent);color:var(--hero)}
.hero ::selection{background:var(--hero-accent);color:var(--hero)}

/* moldura de foto */
.niche{position:relative;overflow:hidden;background:var(--soft);max-width:100%}
.niche img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.niche .pat{position:absolute;inset:0}
.niche .nophoto{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:var(--bg);color:var(--ink-2);font:500 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;white-space:nowrap}
.niche .nophoto .ico{width:14px;height:14px}
.ex,.tag{position:absolute;right:10px;top:10px;z-index:1;background:var(--pill);color:var(--on-pill);font:400 19px/1 var(--pixel);letter-spacing:.02em;text-transform:uppercase;padding:4px 12px 5px;border-radius:999px}
@media (max-width:600px){.ex,.tag{font-size:16px;padding:3px 9px 4px;right:8px;top:8px}}
.incart{position:absolute;left:10px;top:10px;z-index:1;background:var(--pink);color:var(--red-ink);font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:3px}

/* blocos de categoria */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:8px}
@media (min-width:720px){.tiles{gap:12px;padding-top:12px}}
.tile{position:relative;display:block;width:100%;aspect-ratio:3/4;max-width:100%;overflow:hidden;border:0;padding:0;background:none;cursor:pointer}
.tile.wide{grid-column:1/-1;aspect-ratio:16/9}
@media (min-width:720px){.tile{aspect-ratio:16/10}.tile.wide{aspect-ratio:30/9}}
.tile .niche img{object-position:center 18%}
.tile .niche{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
.tile:hover .niche{transform:scale(1.035)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(195deg,transparent 30%,var(--photo-scrim) 78%);pointer-events:none}
.tile .cap{position:absolute;right:7%;bottom:9%;left:7%;z-index:1;color:var(--on-photo);font:400 clamp(19px,3.3vw,46px)/1.05 var(--serif);text-align:right;text-shadow:0 1px 14px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.35)}
.tile .cap span{display:block}

/* passos */
.sec{padding-block:clamp(44px,6vw,84px)}
#catalogo,#como{scroll-margin-top:calc(124px + env(safe-area-inset-top,0px))}
.sec h2,.cathead h2{font:500 clamp(15px,1.4vw,17px)/1.2 var(--ui);letter-spacing:.24em;text-transform:uppercase;margin:0 0 28px;text-align:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:26px;counter-reset:s}
@media (min-width:780px){.steps{grid-template-columns:repeat(3,1fr);gap:40px}}
#como{background:var(--blush)}
#como h2{color:var(--pink-deep)}
.steps li{counter-increment:s;text-align:center;display:grid;justify-items:center;gap:6px}
.steps li::before{content:counter(s);font:300 italic 68px/1 var(--shout);font-variation-settings:"opsz" 144;color:var(--pink)}
.steps h3{margin:0;font:600 14px var(--ui);letter-spacing:.1em;text-transform:uppercase}
.steps p{margin:0;color:var(--ink-2);font-size:15px;max-width:30ch}

/* catálogo */
.catalog{padding-top:clamp(48px,6vw,88px)}
.cathead{text-align:center;margin-bottom:14px}
.cathead h2{margin-bottom:8px;font:300 italic clamp(44px,6vw,76px)/1 var(--shout);letter-spacing:-.02em;text-transform:none;color:var(--pink)}
.cathead p{margin:0;color:var(--ink-2);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:28px;scrollbar-width:none}
@media (min-width:900px){.chips{justify-content:center}}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);padding:0 16px;min-height:40px;font:500 12.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);transition:border-color .2s,color .2s,background-color .2s}
.chip[aria-pressed="true"]{border-color:var(--pink);background:var(--pink);color:var(--red-ink)}
.chip:hover:not([aria-pressed="true"]){border-color:var(--pink);color:var(--pink-deep)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 10px}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 16px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;min-width:0}
.card .media{position:relative;display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;overflow:hidden}
.card .niche{aspect-ratio:3/4;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.card .media:hover .niche{transform:scale(1.03)}
.card h3{font:500 15px/1.3 var(--ui);letter-spacing:.02em;text-transform:uppercase;margin:12px 0 4px}
.card .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.card .price b{font:700 18px var(--ui);color:var(--pink-deep)}
.card .price span{font-size:13px;color:var(--ink-2)}
.meta{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.addbtn{margin-top:12px;width:100%;min-height:44px;border:1px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font:600 12.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;transition:background-color .2s,color .2s}
.addbtn .ico{width:16px;height:16px}
.addbtn:hover{background:var(--ink);color:var(--bg)}
.addbtn.on{background:var(--pink);border-color:var(--pink);color:var(--red-ink)}
.empty{border:1px dashed var(--line);padding:36px 20px;text-align:center;color:var(--ink-2)}

/* rodapé */
.foot{margin-top:0!important;background:var(--wine);color:var(--on-wine);padding-block:56px 120px;margin-top:clamp(40px,6vw,80px)}
.foot .grid3{display:grid;gap:28px}
@media (min-width:780px){.foot .grid3{grid-template-columns:1.3fr 1fr 1fr}}
.foot .mark{font:300 italic clamp(36px,4vw,50px)/1 var(--shout);margin:0 0 14px;color:var(--sun)}
.foot .linkbtn{color:var(--on-wine)}
.foot .btn-ghost{border-color:var(--on-wine);color:var(--on-wine)}
.foot .btn-ghost:hover{background:var(--on-wine);color:var(--wine)}
.foot ::selection{background:var(--sun);color:var(--on-sun)}
.foot h4{margin:0 0 10px;font:600 12px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--on-wine-2)}
.foot p{margin:0;font-size:15px}
.copyrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copyrow code{font:600 17px var(--ui);user-select:all}
.linkbtn{border:0;background:none;padding:6px;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font:500 13px var(--ui);letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
/* floating */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:60px;height:60px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:grid;place-items:center;box-shadow:0 12px 26px -10px var(--shade);transition:transform .25s cubic-bezier(.2,.8,.2,1),bottom .3s}
.fab .ico{width:30px;height:30px}
.fab:hover{transform:scale(1.06)}
body.hasbar .fab{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -12px 30px -18px var(--shade);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:78px}
.bar .info{flex:1;min-width:0}
.bar .line1{font-weight:700;font-size:15px}
.bar .line2{font-size:13px;color:var(--ink-2)}
.prog{height:6px;border-radius:1px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--red);transition:width .45s cubic-bezier(.16,1,.3,1)}
.prog.done i{background:var(--ok)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .34s cubic-bezier(.16,1,.3,1);overscroll-behavior:contain}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(640px,92vw);max-height:88vh;border-radius:var(--r-sheet);transform:translate(-50%,-50%);animation:pop .3s cubic-bezier(.16,1,.3,1)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px)}}
@keyframes pop{from{transform:translate(-50%,-46%)}}
.sheet header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet header h2{font:400 26px/1.1 var(--serif);margin:0;flex:1}
.x{border:0;background:var(--soft);width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;transition:background-color .2s}
.x:hover{background:var(--line)}
.pick{display:grid;gap:18px}
@media (min-width:560px){.pick{grid-template-columns:190px 1fr}}
.pick .niche{aspect-ratio:3/4;height:min(40vh,340px);width:auto;margin:0 auto}
@media (min-width:560px){.pick .niche{height:auto;width:100%}}
.thumbs{display:flex;gap:6px;margin-top:8px}
.thumbs button{border:2px solid transparent;padding:0;border-radius:var(--r-sm);overflow:hidden;width:44px;height:56px;background:none}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.sizes{display:grid;gap:8px;margin:12px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 6px 6px 16px}
.srow b{font:400 20px var(--serif)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:var(--r-sm);border:0;background:var(--soft);display:grid;place-items:center}
.step button:hover:not(:disabled){background:var(--line)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:36px;text-align:center;font-weight:700;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);margin-top:6px;font-weight:700}
.note{font-size:14px;color:var(--ink-2);margin:0}
.lines{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.lines li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.lines .niche{width:52px;height:66px}
.lines .t{font-weight:600;font-size:15px;line-height:1.25}
.lines .d{font-size:13px;color:var(--ink-2)}
.status{border-radius:var(--r-sm);padding:12px 14px;font-weight:600;font-size:15px;margin:12px 0;background:var(--blush);color:var(--ink)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--bg))}

/* forms */
.f{display:grid;gap:14px}
.f2{display:grid;gap:14px}
@media (min-width:560px){.f2{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lab{font-weight:600;font-size:14px}
.fld .hint{font-size:13px;color:var(--ink-2)}
.in{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:10px 12px;font-size:16px;caret-color:var(--red)}
.in:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 14px;min-height:44px;font-weight:500;cursor:pointer;transition:border-color .2s}
.checks label:hover{border-color:var(--ink-2)}
.checks label:has(input:checked){border-color:var(--ink)}
.checks input{accent-color:var(--red);width:18px;height:18px}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:0}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photos .p{position:relative;width:84px;height:108px;border-radius:4px;overflow:hidden;background:var(--soft)}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p button{position:absolute;bottom:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center}
.photos .p button .ico{width:16px;height:16px}
.upl{position:relative;width:84px;height:108px;border:1.5px dashed var(--ink-2);border-radius:4px;display:grid;place-items:center;align-content:center;gap:4px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:6px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}

/* admin */
.adminbar{position:sticky;top:calc(69px + env(safe-area-inset-top,0px));z-index:15;background:var(--ink);color:var(--bg)}
.adminbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px}
.adminbar .msg{flex:1;min-width:200px;font-weight:600;font-size:15px}
.adminbar .btn-pub{background:var(--red);color:var(--red-ink)}
.adminbar .btn-pub[aria-disabled="true"]{background:color-mix(in srgb,var(--bg) 18%,transparent);color:color-mix(in srgb,var(--bg) 70%,transparent)}
.adminbar .linkbtn{color:var(--bg);text-decoration:none}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alist li{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px}
@media (min-width:700px){.alist li{grid-template-columns:56px 1fr auto}}
.alist .niche{width:56px;height:70px}
.alist .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
@media (min-width:700px){.alist .acts{grid-column:auto}}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--line);color:var(--ink-2);margin-left:6px;vertical-align:2px}
.pill.warn{background:var(--blush);color:var(--red)}
.box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.box h3{margin:0 0 12px;font-size:18px}
.meter{font-size:13px;color:var(--ink-2)}
.danger{color:var(--danger)}
.btn-danger{background:var(--danger);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.adminpage{background:var(--soft);min-height:70vh}

function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; }}
var S = {
  lang: "pt",
  cat: "all",
  cart: store("am_cart") || {},

  sheet:null, pick:null, form:null, delArm:null, readOnly:false

function t(k,v){ var s=(T[S.lang][k]!==undefined?T[S.lang][k]:T.pt[k]); if(s===undefined) s=k; if(v) for(var x in v) s=s.split("{"+x+"}").join(v[x]); return s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function L(o){ if(!o) return ""; if(typeof o==="string") return o; return (S.lang==="es" && o.es) ? o.es : (o.pt||o.es||""); }
function money(n){ try{ return new Intl.NumberFormat(S.lang==="es"?"es-AR":"pt-BR",{style:"currency",currency:"BRL"}).format(n||0);}catch(e){ return "R$ "+(n||0).toFixed(2); } }
function prod(id){ for(var i=0;i<DATA.products.length;i++) if(DATA.products[i].id===id) return DATA.products[i]; return null; }
function minP(){ return Math.max(1, parseInt(DATA.settings.minPieces,10)||20); }
function waNum(){ return String(DATA.settings.whatsapp||"").replace(/\D/g,""); }
function waPretty(){ var d=waNum(); if(d.length===13) return "+"+d.slice(0,2)+" "+d.slice(2,4)+" "+d.slice(4,9)+"-"+d.slice(9); return d?"+"+d:""; }
function waLink(text){ return "https://wa.me/"+waNum()+"?text="+encodeURIComponent(text); }
function itemPieces(it){ var n=0; for(var s in it) n+= (it[s]|0); return n; }
function visible(){ return DATA.products.filter(function(p){return !p.hidden;}); }
function totals(){
  var p=0,v=0,lines=[];
  for(var id in S.cart){ var pr=prod(id); if(!pr||pr.hidden) continue; var n=itemPieces(S.cart[id]); if(!n) continue; p+=n; v+=n*pr.price; lines.push({p:pr,it:S.cart[id],n:n}); }
  return {pieces:p,value:v,lines:lines};
}
function saveCart(){ for(var id in S.cart){ if(!prod(id)||!itemPieces(S.cart[id])) delete S.cart[id]; } store("am_cart",S.cart); }

function patCss(p){
  var a=(p&&p.a)||"#d8c7bb", b=(p&&p.b)||"#f1e8e1", tp=(p&&p.t)||"solid";
  if(tp==="stripe") return "background:repeating-linear-gradient(90deg,"+a+" 0 12px,"+b+" 12px 24px)";
  if(tp==="dots") return "background:radial-gradient(circle,"+a+" 3.5px,transparent 4px) 0 0/18px 18px,"+b;
  return "background:linear-gradient(170deg,"+b+","+a+")";
}
function photoBox(p, opts){
  opts=opts||{}; var h="";
  h+='<div class="pat" style="'+patCss(p.pattern)+'"></div>';
  if(p.photos && p.photos.length){ h+='<img src="'+esc(p.photos[opts.idx||0])+'" alt="'+esc(L(p.name))+'" loading="'+(opts.eager?"eager":"lazy")+'" decoding="async" onerror="this.remove()">'; }
  else if(!opts.mini) h+='<span class="nophoto">'+ic("cam")+esc(t("noPhoto"))+'</span>';
  return h;
}

/* ---------- images ---------- */
function compress(file,max){ max=max||IMG_MAX;
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=rej;
    r.onload=function(){ var im=new Image(); im.onerror=rej; im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
      var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",IMG_Q)); }; im.src=r.result; };
    r.readAsDataURL(file);
  });
}

function refocus(sel){ var b=sheetEl.querySelector(sel); if(b&&!b.disabled){ b.focus(); return true; } return false; }
function onAct(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  if(el.getAttribute("aria-disabled")==="true"){ e.preventDefault(); return; }
  switch(a){
    case "home": e.preventDefault(); if(S.view!=="shop"){S.view="shop";render();} window.scrollTo(0,0); break;
    case "lang": S.lang=v; render(); if(S.sheet) renderSheet(null); break;
    case "goto": var g=document.getElementById(v); if(g) g.scrollIntoView(); break;
    case "navcat": S.cat=v; render(); var cg=document.getElementById("catalogo"); if(cg) cg.scrollIntoView(); break;
    case "cat": S.cat=v; render(); var c=app.querySelector('[data-act="cat"][data-v="'+v+'"]'); if(c) c.focus(); break;
    case "order": openSheet("order"); break;
    case "pick": S.pick={id:v,q:Object.assign({},S.cart[v]||{}),img:0}; var wasOpen=!!S.sheet; S.sheet=null; if(!wasOpen) lastFocus=el; S.sheet="pick"; sheetEl.innerHTML=""; renderSheet(); break;
    case "pimg": S.pick.img=+v; renderSheet(null); refocus('[data-act="pimg"][data-v="'+v+'"]'); break;
    case "q": var s=el.getAttribute("data-s"), d=el.getAttribute("data-d"); S.pick.q[s]=Math.max(0,(S.pick.q[s]|0)+(+d)); renderSheet(null);
      if(!refocus('[data-act="q"][data-s="'+s+'"][data-d="'+d+'"]')) refocus('[data-act="q"][data-s="'+s+'"][data-d="1"]'); break;
    case "grade": var pp=prod(S.pick.id); (pp.sizes||[]).forEach(function(z){S.pick.q[z]=(S.pick.q[z]|0)+1;}); renderSheet(null); refocus('[data-act="grade"]'); break;
    case "qclear": S.pick.q={}; renderSheet(null); refocus('[data-act="qclear"]'); break;
    case "psave": var q={}; for(var k in S.pick.q){ if(S.pick.q[k]>0) q[k]=S.pick.q[k]; } if(itemPieces(q)) S.cart[S.pick.id]=q; else delete S.cart[S.pick.id]; saveCart(); closeSheet(); render(); break;
    case "close": closeSheet(); break;
    case "copy":
      var num=waPretty(), lbl=document.getElementById("copy-lbl");
      var done=function(){ if(lbl){ lbl.textContent=t("copied"); setTimeout(function(){ if(lbl) lbl.textContent=t("copy"); },1600);} };
      try{ navigator.clipboard.writeText(num).then(done,selectNum); }catch(err){ selectNum(); }
      break;
    case "admin": S.view="admin"; render(); window.scrollTo(0,0); break;
    case "shop": S.view="shop"; S.delArm=null; render(); window.scrollTo(0,0); break;
    case "publish": publish(); break;
    case "coverdel": delete DATA.settings.cover; delete DATA.settings.coverAr; markDirty(); render(); break;
    case "anew": S.form={p:{id:"",ref:"",name:{pt:"",es:""},price:0,cat:"vestidos",sizes:["G1","G2","G3","G4"],colors:{pt:"",es:""}},photos:[],errs:[],photoErr:false}; openSheet("form"); break;
    case "aedit": var ep=prod(v); S.form={p:JSON.parse(JSON.stringify(ep)),photos:(ep.photos||[]).slice(),errs:[],photoErr:false}; openSheet("form"); break;
    case "ahide": var hp=prod(v); hp.hidden=!hp.hidden; markDirty(); render(); break;
    case "adel": if(S.delArm===v){ DATA.products=DATA.products.filter(function(p){return p.id!==v;}); delete S.cart[v]; saveCart(); S.delArm=null; markDirty(); } else S.delArm=v; render(); break;
    case "fphotodel": readForm(); S.form.photos.splice(+v,1); renderSheet(null); refocus("#f-photo"); break;
  }
}

  if(!p.sizes.length) errs.push("aErrSizes");
  if(errs.length){ S.form.errs=errs; renderSheet("f-npt"); return; }
  if(!p.name.pt) p.name.pt=p.name.es;
  var out={id:p.id||("p"+Date.now().toString(36)),ref:p.ref||"",name:p.name,price:price,cat:p.cat,sizes:SIZES.filter(function(s){return p.sizes.indexOf(s)>=0;}),colors:p.colors,photos:S.form.photos.slice(),pattern:p.pattern||{t:"solid",a:"#d8c7bb",b:"#f1e8e1"},hidden:!!p.hidden};
  if(p.example && S.form.photos.length) out.example=false; else if(p.example) out.example=true;
  var i=DATA.products.findIndex(function(x){return x.id===out.id;});
  if(i>=0) DATA.products[i]=out; else DATA.products.unshift(out);
  markDirty(); closeSheet(); render();
});
app.addEventListener("change",function(e){
  if(!e.target.form||e.target.form.id!=="settings-form") return;
  if(e.target.id==="set-cover"){ var cf=e.target.files&&e.target.files[0]; if(cf) compress(cf,1400).then(function(d){ DATA.settings.cover=d; var ci=new Image(); ci.onload=function(){ DATA.settings.coverAr=Math.round(ci.naturalWidth/ci.naturalHeight*10000)/10000; render(); }; ci.src=d; markDirty(); render(); }).catch(function(){ S.adminMsg=t("aPhotoErr"); render(); }); return; }
  if(e.target.name==="wa"){ var d=e.target.value.replace(/\D/g,""); if(d&&d!==waNum()){ DATA.settings.whatsapp=d; markDirty(); render(); } }
  if(e.target.name==="min"){ var m=parseInt(e.target.value,10); if(m>0&&m!==minP()){ DATA.settings.minPieces=m; markDirty(); render(); } }
});

saveCart(); render();

/* ---------- editor detection ---------- */
(function(){
  var c=window.claude; if(!c||typeof c.use!=="function") return;
  Promise.all([c.use("artifact"),c.use("user")]).then(function(r){
    var art=r[0], user=r[1]; if(!art||!user) return;
    return user.canEdit().then(function(ok){ if(ok){ S.canEdit=true; S.art=art; render(); } });
  }).catch(function(){});
})();
})();
</script>
